<nav class="navbar" aria-label="Main">
  <div class="nav-inner container">
    <button type="button" class="logo" (click)="go('home')" aria-label="Back to top">
      otniel<span class="dot">.</span>iacob
    </button>

    <button
      type="button"
      class="menu-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="nav-links"
      [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'">
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="22" />
    </button>

    <ul id="nav-links" class="nav-links" [class.open]="menuOpen()">
      @for (link of links; track link.id) {
        <li>
          <button
            type="button"
            class="nav-link"
            [class.active]="active() === link.id"
            [attr.aria-current]="active() === link.id ? 'true' : null"
            (click)="go(link.id)">
            {{ link.label }}
          </button>
        </li>
      }
      <li>
        <a class="nav-link nav-link--cta" routerLink="/adventures" (click)="closeMenu()">Adventures</a>
      </li>
    </ul>
  </div>

  @if (menuOpen()) {
    <div class="backdrop" (click)="closeMenu()" aria-hidden="true"></div>
  }
</nav>
