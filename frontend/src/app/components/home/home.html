<section class="hero-section">

  <div class="hero-text">
<span class="badge">{{ profile?.role }}</span>    <h1>{{ profile?.headline ?? 'Building the Future with Code' }}</h1>
    <h2>{{ profile?.name ?? 'Otniel-Viorel Iacob' }}</h2>

    <div class="quote-wrapper" *ngIf="profile?.quote">
      <p class="description">"{{ profile?.quote }}"</p>
      <span class="author" *ngIf="profile?.quoteAuthor">— {{ profile?.quoteAuthor }}</span>
    </div>

    <div class="cta-buttons">
      <a [href]="profile?.cvPdf ?? 'documents/otniel-iacob-cv.pdf'" class="btn-neon">Contact Me</a>
    </div>
  </div>

  <div class="hero-visual">
    <div class="orbit-ring ring-1"></div>
    <div class="orbit-ring ring-2"></div>
    <div class="orbit-ring ring-3"></div>

    <div class="tech-icon icon-angular">Angular</div>
    <div class="tech-icon icon-ts">TypeScript</div>
    <div class="tech-icon icon-css">SCSS</div>
    <div class="tech-icon icon-git">Git</div>

    <div class="tech-icon icon-java">Java</div>
    <div class="tech-icon icon-python">Python</div>
    <div class="tech-icon icon-cpp">C++</div>
    <div class="tech-icon icon-sql">SQL</div>
    <div class="tech-icon icon-c">C</div>

    <div class="tech-icon icon-linux">Linux</div>
    <div class="tech-icon icon-node">Node.js</div>

    <div class="avatar-center">
      <img
        ngSrc="assets/tech-core.webp"
        width="350"
        height="350"
        alt="Otniel Iacob"
        class="main-tech-img"
        priority
      >
    </div>
  </div>

</section>
