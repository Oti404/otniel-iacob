<div class="container">
  <h1 class="page-title">Personal Projects</h1>

  <div class="projects-grid">

    <div class="project-card"
         *ngFor="let p of sortedProjects"
         [class.wip-card]="p.status === 'wip'">

      <div class="card-header">
        <h2>{{ p.name }}</h2>

        <div class="status-badge wip" *ngIf="p.status === 'wip'">
          <span class="blink-dot">●</span> IN DEV
        </div>

        <div class="status-badge completed" *ngIf="p.status === 'completed'">
          <span *ngIf="p.endDate; else singleDate">
            {{ p.date | date:'MMM yyyy' }} - {{ p.endDate | date:'MMM yyyy' }}
          </span>
          <ng-template #singleDate>
            {{ p.date | date:'yyyy' }}
          </ng-template>
        </div>
      </div>

      <div class="award-badge" *ngIf="p.awards">
        <span>🏆 {{ p.awards }}</span>
      </div>

      <p class="description" [class.collapsed]="!expanded[p.id]">{{ p.description }}</p>
      <button class="read-more" *ngIf="p.description.length > 150" (click)="toggle(p.id)">
        {{ expanded[p.id] ? '↑ less' : '↓ more' }}
      </button>

      <div class="contributors" *ngIf="p.contributors && p.contributors.length > 0">
        <small>Team:</small>
        <div class="contributors-list">
          <ng-container *ngFor="let c of p.contributors">
            <a *ngIf="c.link" [href]="c.link" target="_blank" class="contributor-chip contributor-link">{{ c.name }}</a>
            <span *ngIf="!c.link" class="contributor-chip">{{ c.name }}</span>
          </ng-container>
        </div>
      </div>
      <div class="tech-stack">
        <span class="tech-tag" *ngFor="let t of splitTech(p.tech)">{{ t }}</span>
      </div>

      <div class="action-buttons">

        <a *ngIf="p.liveLink"
           [href]="p.liveLink"
           target="_blank"
           class="btn-action btn-live">
           <span class="pulse-icon">●</span> LIVE DEMO
        </a>

        <a *ngIf="p.link && p.link !== '#'"
           [href]="p.link"
           target="_blank"
           class="btn-action btn-code">
           <span class="code-icon">💻</span>
           {{ p.status === 'wip' ? 'View Progress' : 'View Code' }}
        </a>

      </div>
    </div>
  </div>
</div>
