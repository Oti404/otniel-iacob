name: Deploy to AWS EC2

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Copy setup scripts to EC2
        run: |
          scp -i ~/.ssh/ec2_key.pem scripts/setup-ec2.sh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/setup-ec2.sh
          scp -i ~/.ssh/ec2_key.pem scripts/nginx-prod.conf ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/nginx-prod.conf

      - name: Run setup on EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "chmod +x /tmp/setup-ec2.sh && sudo /tmp/setup-ec2.sh"

      - name: Sync files to EC2
        run: |
          rsync -az --exclude 'node_modules' --exclude '.git' --exclude 'database/data' \
            -e "ssh -i ~/.ssh/ec2_key.pem" \
            ./ ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/app/

      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "cd ~/app && sudo docker compose -f docker-compose.prod.yml up -d --build"

      - name: Run database migrations
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "
            set -a && source ~/app/.env && set +a
            sudo docker run --rm --network monorepo-net \
              -e DATABASE_URL=\"postgresql://\${POSTGRES_USER}:\${POSTGRES_PASSWORD}@postgres:5432/\${POSTGRES_DB}\" \
              -v ~/app/database:/app/database \
              node:20-alpine \
              sh -c 'cd /app/database && npm install --silent && npx prisma migrate deploy --schema prisma/schema.prisma'
          "
