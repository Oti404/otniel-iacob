name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          cat >> ~/.ssh/config << EOF
          StrictHostKeyChecking no
          ServerAliveInterval 30
          ServerAliveCountMax 10
          ConnectTimeout 30
          EOF

      - name: Copy setup scripts to EC2
        run: |
          scp -i ~/.ssh/ec2_key.pem scripts/setup-ec2.sh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/setup-ec2.sh
          scp -i ~/.ssh/ec2_key.pem scripts/setup-nginx.sh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/setup-nginx.sh
          scp -i ~/.ssh/ec2_key.pem scripts/nginx-prod.conf ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/nginx-prod.conf

      - name: Run Docker setup on EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "chmod +x /tmp/setup-ec2.sh && sudo /tmp/setup-ec2.sh"

      - name: Configure nginx and SSL
        if: env.EC2_DOMAIN != ''
        env:
          EC2_DOMAIN: ${{ secrets.EC2_DOMAIN }}
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "chmod +x /tmp/setup-nginx.sh && sudo /tmp/setup-nginx.sh ${{ secrets.EC2_DOMAIN }} ${{ secrets.CERTBOT_EMAIL }}"

      - name: Write .env on EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "
            mkdir -p ~/app
            cat > ~/app/.env << 'ENVEOF'
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          ALLOWED_ORIGINS=https://${{ secrets.EC2_DOMAIN }}
          INTERNAL_API_KEY=${{ secrets.INTERNAL_API_KEY }}
          N8N_CHAT_WEBHOOK_URL=http://n8n:5678/webhook/${{ secrets.N8N_WEBHOOK_ID }}/chat
          N8N_WEBHOOK_URL=http://localhost:5678/
          ENVEOF
          "

      - name: Sync files to EC2
        run: |
          rsync -az --delete --exclude 'node_modules' --exclude '.git' --exclude 'database/data' --exclude '.env' \
            -e "ssh -i ~/.ssh/ec2_key.pem" \
            ./ ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/app/

      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "cd ~/app && sudo docker compose -f docker-compose.prod.yml up -d --build --remove-orphans"

      - name: Health check
        run: |
          sleep 15
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "curl -sf http://localhost:3000/api/health || (echo 'Health check failed' && exit 1)"
