name: Deploy to AWS EC2

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          cat >> ~/.ssh/config << EOF
          StrictHostKeyChecking no
          ServerAliveInterval 30
          ServerAliveCountMax 10
          ConnectTimeout 30
          EOF

      - name: Copy setup scripts to EC2
        run: |
          scp -i ~/.ssh/ec2_key.pem scripts/setup-ec2.sh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/setup-ec2.sh
          scp -i ~/.ssh/ec2_key.pem scripts/nginx-prod.conf ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/nginx-prod.conf

      - name: Run setup on EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "chmod +x /tmp/setup-ec2.sh && sudo /tmp/setup-ec2.sh"

      - name: Write .env on EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "
            mkdir -p ~/app
            cat > ~/app/.env << 'ENVEOF'
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          ALLOWED_ORIGINS=http://${{ secrets.EC2_HOST }}
          ENVEOF
          "

      - name: Sync files to EC2
        run: |
          rsync -az --exclude 'node_modules' --exclude '.git' --exclude 'database/data' \
            -e "ssh -i ~/.ssh/ec2_key.pem" \
            ./ ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/app/

      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "cd ~/app && sudo docker compose -f docker-compose.prod.yml up -d --build"

      - name: Run database migrations
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "sudo docker exec app-backend-1 sh -c 'cd /app/database && npx prisma migrate deploy --schema prisma/schema.prisma'"
